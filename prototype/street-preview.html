<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neon Streets HK — GLB Street Preview</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#080b12;color:#eef;font:14px system-ui,sans-serif}
  #hud{position:fixed;left:16px;top:16px;z-index:2;max-width:420px;padding:14px 16px;border:1px solid #394052;background:rgba(6,10,18,.82);backdrop-filter:blur(10px)}
  #hud strong{display:block;font-size:15px;margin-bottom:6px}
  #status{color:#a8c5d9;line-height:1.5}
  #note{color:#8793a5;font-size:12px;margin-top:8px;line-height:1.5}
</style>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="hud">
  <strong>NEON STREETS HK — KOWLOON STREET</strong>
  <div id="status">Loading assets/hk-kowloon-street.glb…</div>
  <div id="note">Drag to orbit · Scroll to zoom · Right-drag to pan. Use this page from a local web server, not file://. This previews the environment only; it is not the full game.</div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080b12);
scene.fog=new THREE.Fog(0x080b12,90,260);
const camera=new THREE.PerspectiveCamera(53,innerWidth/innerHeight,0.1,1000);
camera.position.set(35,24,38);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,6,-5);controls.enableDamping=true;controls.dampingFactor=0.06;
scene.add(new THREE.HemisphereLight(0x8592b7,0x13151b,1.3));
const moon=new THREE.DirectionalLight(0x9aafff,2.0);moon.position.set(-18,38,18);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);scene.add(moon);
const warm=new THREE.PointLight(0xff672f,55,38);warm.position.set(-5,6,3);scene.add(warm);
const cyan=new THREE.PointLight(0x0879ff,38,30);cyan.position.set(5,8,-18);scene.add(cyan);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),new THREE.MeshStandardMaterial({color:0x080b11,roughness:0.88}));
ground.rotation.x=-Math.PI/2;ground.position.y=-0.15;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(200,40,0x243044,0x151d2a);grid.position.y=-0.14;scene.add(grid);
const status=document.getElementById('status');
new GLTFLoader().load('./assets/hk-kowloon-street.glb',gltf=>{
  const root=gltf.scene;root.position.y=0.07;scene.add(root);
  let meshes=0,lights=0;
  root.traverse(o=>{if(o.isMesh){meshes++;o.castShadow=true;o.receiveShadow=true;}if(o.isLight)lights++;});
  status.textContent=`Loaded successfully · ${meshes} mesh objects · ${lights} embedded lights. Inspect the geometry and materials here before integrating it into the game.`;
},xhr=>{
  if(xhr.total)status.textContent=`Loading… ${Math.round(xhr.loaded/xhr.total*100)}%`;
},err=>{
  console.error(err);
  status.textContent='Could not load the GLB. Ensure it is saved at assets/hk-kowloon-street.glb and that this page is served over HTTP.';
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
animate();
</script>
</body>
</html>
